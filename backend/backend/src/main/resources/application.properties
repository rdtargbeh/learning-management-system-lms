# LMS backend configuration. Secrets come from environment variables; never commit real values.
spring.application.name=lms-backend

# ---------- Database (PostgreSQL) ----------
spring.datasource.url=${LMS_DB_URL:jdbc:postgresql://localhost:5432/lms}
# Connect as a LOGIN role that is a member of lms_app (NOT a superuser: superusers bypass row-level security).
spring.datasource.username=${LMS_DB_USER:lms_api}
spring.datasource.password=${LMS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${LMS_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-init-sql=SET search_path TO lms_core, public

# ---------- JPA / Hibernate ----------
spring.jpa.open-in-view=false
# The schema is owned by the SQL scripts in src/main/resources/db/schema; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=lms_core
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JSON ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Server ----------
server.port=${PORT:8081}
server.error.include-message=always

# ---------- Security (JWT) ----------
# HMAC secret for signing access tokens: at least 32 random bytes, e.g. `openssl rand -base64 48`.
lms.security.jwt-secret=${LMS_JWT_SECRET:}
lms.security.token-ttl-minutes=${LMS_TOKEN_TTL_MINUTES:60}
lms.security.issuer=${LMS_JWT_ISSUER:lms-backend}

# ---------- First-start bootstrap ----------
# On first start, if no platform user exists, this super admin is created. Leave empty to skip.
lms.bootstrap.platform-admin-email=${LMS_BOOTSTRAP_ADMIN_EMAIL:}
lms.bootstrap.platform-admin-password=${LMS_BOOTSTRAP_ADMIN_PASSWORD:}

# ---------- Logging ----------
logging.level.learning_management_system.backend=INFO
